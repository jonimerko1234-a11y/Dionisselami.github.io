<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Na Kontaktoni - S.R.S Ashensorë</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'srs-navy': '#0A192F',
                        'srs-light-navy': '#112240',
                        'srs-cyan': '#64FFDA',
                        'srs-slate': '#8892B0',
                        'srs-light-slate': '#CCD6F6',
                        'srs-white': '#E6F1FF',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap');
        body {
            font-family: 'Montserrat', sans-serif;
        }
    </style>
</head>
<body class="bg-srs-navy min-h-screen">
    <div class="container mx-auto px-4 py-12">
        <div class="max-w-2xl mx-auto">
            <!-- Header -->
            <div class="text-center mb-12">
                <a href="index.html" class="inline-flex items-center text-srs-cyan hover:text-srs-white transition-colors mb-6">
                    <i data-feather="arrow-left" class="mr-2"></i>
                    Kthehu në Faqen Kryesore
                </a>
                <h1 class="text-4xl md:text-5xl font-bold text-srs-white mb-4">Na Kontaktoni</h1>
                <p class="text-lg text-srs-slate">Jemi këtu për t'ju ndihmuar. Dërgoni mesazhin tuaj dhe do t'ju përgjigjemi së shpejti.</p>
            </div>

            <!-- Form -->
            <div class="bg-srs-light-navy rounded-lg shadow-2xl p-8">
                <form id="contactForm" class="space-y-6">
                    <div>
                        <label for="name" class="block text-srs-white mb-2 font-medium">Emri dhe Mbiemri *</label>
                        <input type="text" id="name" name="name" required
                            class="w-full px-4 py-3 rounded-md bg-srs-navy text-srs-white border border-srs-slate focus:border-srs-cyan focus:outline-none transition-colors">
                    </div>

                    <div>
                        <label for="email" class="block text-srs-white mb-2 font-medium">Email *</label>
                        <input type="email" id="email" name="email" required
                            class="w-full px-4 py-3 rounded-md bg-srs-navy text-srs-white border border-srs-slate focus:border-srs-cyan focus:outline-none transition-colors">
                    </div>

                    <div>
                        <label for="phone" class="block text-srs-white mb-2 font-medium">Telefoni *</label>
                        <input type="tel" id="phone" name="phone" required
                            class="w-full px-4 py-3 rounded-md bg-srs-navy text-srs-white border border-srs-slate focus:border-srs-cyan focus:outline-none transition-colors">
                    </div>

                    <div>
                        <label for="subject" class="block text-srs-white mb-2 font-medium">Subjekti</label>
                        <input type="text" id="subject" name="subject"
                            class="w-full px-4 py-3 rounded-md bg-srs-navy text-srs-white border border-srs-slate focus:border-srs-cyan focus:outline-none transition-colors">
                    </div>

                    <div>
                        <label for="message" class="block text-srs-white mb-2 font-medium">Mesazhi *</label>
                        <textarea id="message" name="message" rows="6" required
                            class="w-full px-4 py-3 rounded-md bg-srs-navy text-srs-white border border-srs-slate focus:border-srs-cyan focus:outline-none transition-colors"
                            placeholder="Shkruani mesazhin tuaj këtu..."></textarea>
                    </div>

                    <button type="submit"
                        class="w-full bg-srs-cyan text-srs-navy py-4 rounded-md font-semibold text-lg hover:brightness-110 transform hover:scale-105 transition-all duration-300 shadow-lg">
                        Dërgo Mesazhin
                    </button>
                </form>

                <!-- Success Message -->
                <div id="successMessage" class="hidden mt-6 bg-green-500 bg-opacity-20 border border-green-500 text-green-400 px-6 py-4 rounded-md">
                    <div class="flex items-center">
                        <i data-feather="check-circle" class="mr-3"></i>
                        <div>
                            <p class="font-semibold">Mesazhi u dërgua me sukses!</p>
                            <p class="text-sm">Faleminderit për kontaktin. Do t'ju përgjigjemi së shpejti.</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Contact Info -->
            <div class="mt-12 grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-srs-light-navy rounded-lg p-6 text-center">
                    <div class="w-12 h-12 bg-srs-cyan rounded-full flex items-center justify-center mx-auto mb-4">
                        <i data-feather="phone" class="text-srs-navy"></i>
                    </div>
                    <h3 class="text-srs-white font-semibold mb-2">Telefoni</h3>
                    <p class="text-srs-slate">+355 XX XXX XXX</p>
                </div>

                <div class="bg-srs-light-navy rounded-lg p-6 text-center">
                    <div class="w-12 h-12 bg-srs-cyan rounded-full flex items-center justify-center mx-auto mb-4">
                        <i data-feather="mail" class="text-srs-navy"></i>
                    </div>
                    <h3 class="text-srs-white font-semibold mb-2">Email</h3>
                    <p class="text-srs-slate">vendos email</p>
                </div>

                <div class="bg-srs-light-navy rounded-lg p-6 text-center">
                    <div class="w-12 h-12 bg-srs-cyan rounded-full flex items-center justify-center mx-auto mb-4">
                        <i data-feather="map-pin" class="text-srs-navy"></i>
                    </div>
                    <h3 class="text-srs-white font-semibold mb-2">Adresa</h3>
                    <p class="text-srs-slate">Diku ne lushnje</p>
                </div>
            </div>
        </div>
    </div>

    <script src="backend.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            feather.replace();

            const contactForm = document.getElementById('contactForm');
            const successMessage = document.getElementById('successMessage');

            contactForm.addEventListener('submit', function(e) {
                e.preventDefault();

                const formData = {
                    name: document.getElementById('name').value,
                    email: document.getElementById('email').value,
                    phone: document.getElementById('phone').value,
                    subject: document.getElementById('subject').value,
                    message: document.getElementById('message').value
                };

                Backend.addContactMessage(formData);

                // Show success message
                successMessage.classList.remove('hidden');
                feather.replace();

                // Reset form
                contactForm.reset();

                // Hide success message after 5 seconds
                setTimeout(() => {
                    successMessage.classList.add('hidden');
                }, 5000);

                // Scroll to success message
                successMessage.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            });
        });
    </script>
</body>
</html>
