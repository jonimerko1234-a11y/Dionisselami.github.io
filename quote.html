<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kërko një Kuotë - S.R.S Ashensorë</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'srs-navy': '#0A192F',
                        'srs-light-navy': '#112240',
                        'srs-cyan': '#64FFDA',
                        'srs-slate': '#8892B0',
                        'srs-light-slate': '#CCD6F6',
                        'srs-white': '#E6F1FF',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap');
        body {
            font-family: 'Montserrat', sans-serif;
        }
    </style>
</head>
<body class="bg-srs-navy min-h-screen">
    <div class="container mx-auto px-4 py-12">
        <div class="max-w-2xl mx-auto">
            <!-- Header -->
            <div class="text-center mb-12">
                <a href="index.html" class="inline-flex items-center text-srs-cyan hover:text-srs-white transition-colors mb-6">
                    <i data-feather="arrow-left" class="mr-2"></i>
                    Kthehu në Faqen Kryesore
                </a>
                <h1 class="text-4xl md:text-5xl font-bold text-srs-white mb-4">Kërko një Kuotë</h1>
                <p class="text-lg text-srs-slate">Plotësoni formularin dhe ekipi ynë do t'ju kontaktojë së shpejti</p>
            </div>

            <!-- Form -->
            <div class="bg-srs-light-navy rounded-lg shadow-2xl p-8">
                <form id="quoteForm" class="space-y-6">
                    <div>
                        <label for="name" class="block text-srs-white mb-2 font-medium">Emri dhe Mbiemri *</label>
                        <input type="text" id="name" name="name" required
                            class="w-full px-4 py-3 rounded-md bg-srs-navy text-srs-white border border-srs-slate focus:border-srs-cyan focus:outline-none transition-colors">
                    </div>

                    <div>
                        <label for="email" class="block text-srs-white mb-2 font-medium">Email *</label>
                        <input type="email" id="email" name="email" required
                            class="w-full px-4 py-3 rounded-md bg-srs-navy text-srs-white border border-srs-slate focus:border-srs-cyan focus:outline-none transition-colors">
                    </div>

                    <div>
                        <label for="phone" class="block text-srs-white mb-2 font-medium">Telefoni *</label>
                        <input type="tel" id="phone" name="phone" required
                            class="w-full px-4 py-3 rounded-md bg-srs-navy text-srs-white border border-srs-slate focus:border-srs-cyan focus:outline-none transition-colors">
                    </div>

                    <div>
                        <label for="model" class="block text-srs-white mb-2 font-medium">Modeli i Preferuar *</label>
                        <select id="model" name="model" required
                            class="w-full px-4 py-3 rounded-md bg-srs-navy text-srs-white border border-srs-slate focus:border-srs-cyan focus:outline-none transition-colors">
                            <option value="">Zgjidhni një model</option>
                            <option value="SkyLux Pro">SkyLux Pro - Premium</option>
                            <option value="HomeGlide">HomeGlide - Rezidencial</option>
                            <option value="TitanFlow">TitanFlow - Komercial</option>
                            <option value="Custom">Zgjidhje e Personalizuar</option>
                        </select>
                    </div>

                    <div>
                        <label for="building_type" class="block text-srs-white mb-2 font-medium">Lloji i Ndërtesës</label>
                        <select id="building_type" name="building_type"
                            class="w-full px-4 py-3 rounded-md bg-srs-navy text-srs-white border border-srs-slate focus:border-srs-cyan focus:outline-none transition-colors">
                            <option value="">Zgjidhni llojin</option>
                            <option value="Residential">Rezidencial</option>
                            <option value="Commercial">Komercial</option>
                            <option value="Industrial">Industrial</option>
                            <option value="Mixed">E Përzier</option>
                        </select>
                    </div>

                    <div>
                        <label for="floors" class="block text-srs-white mb-2 font-medium">Numri i Kateve</label>
                        <input type="number" id="floors" name="floors" min="1"
                            class="w-full px-4 py-3 rounded-md bg-srs-navy text-srs-white border border-srs-slate focus:border-srs-cyan focus:outline-none transition-colors">
                    </div>

                    <div>
                        <label for="additional_info" class="block text-srs-white mb-2 font-medium">Informacion Shtesë</label>
                        <textarea id="additional_info" name="additional_info" rows="4"
                            class="w-full px-4 py-3 rounded-md bg-srs-navy text-srs-white border border-srs-slate focus:border-srs-cyan focus:outline-none transition-colors"
                            placeholder="Detaje shtesë për projektin tuaj..."></textarea>
                    </div>

                    <button type="submit"
                        class="w-full bg-srs-cyan text-srs-navy py-4 rounded-md font-semibold text-lg hover:brightness-110 transform hover:scale-105 transition-all duration-300 shadow-lg">
                        Dërgo Kërkesën
                    </button>
                </form>

                <!-- Success Message -->
                <div id="successMessage" class="hidden mt-6 bg-green-500 bg-opacity-20 border border-green-500 text-green-400 px-6 py-4 rounded-md">
                    <div class="flex items-center">
                        <i data-feather="check-circle" class="mr-3"></i>
                        <div>
                            <p class="font-semibold">Kërkesa u dërgua me sukses!</p>
                            <p class="text-sm">Do t'ju kontaktojmë së shpejti.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="backend.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            feather.replace();

            const quoteForm = document.getElementById('quoteForm');
            const successMessage = document.getElementById('successMessage');

            quoteForm.addEventListener('submit', function(e) {
                e.preventDefault();

                const formData = {
                    name: document.getElementById('name').value,
                    email: document.getElementById('email').value,
                    phone: document.getElementById('phone').value,
                    model: document.getElementById('model').value,
                    building_type: document.getElementById('building_type').value,
                    floors: document.getElementById('floors').value,
                    additional_info: document.getElementById('additional_info').value
                };

                Backend.addQuoteRequest(formData);

                // Show success message
                successMessage.classList.remove('hidden');
                feather.replace();

                // Reset form
                quoteForm.reset();

                // Hide success message after 5 seconds
                setTimeout(() => {
                    successMessage.classList.add('hidden');
                }, 5000);

                // Scroll to success message
                successMessage.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            });
        });
    </script>
</body>
</html>
